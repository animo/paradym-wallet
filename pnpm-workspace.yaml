packages:
  - 'packages/*'
  - 'apps/*'

nodeLinker: hoisted

overrides:
  react-native-fs: 'catalog:'
  # Keep a single React/React Native copy. Several native modules (askar, masked-view)
  # and the wallet-sdk declare open-ended react-native peer ranges, and react-dom
  # (via react-native-web/tamagui) would otherwise drag in newer react than the
  # catalog-pinned native one. Pin everything to the SDK 58 versions.
  react: 'catalog:'
  react-dom: 19.3.0
  # Pin exactly: newer react-native releases exist and open-ended peer ranges (tamagui, askar,
  # masked-view, wallet-sdk) would otherwise hoist it over the SDK 58 version.
  react-native: 0.88.0

patchedDependencies:
  '@credo-ts/openid4vc@0.7.1-alpha-20260917134851': patches/@credo-ts__openid4vc@0.7.1-alpha-20260917134851.patch
  '@dr.pogodin/react-native-fs': patches/@dr.pogodin__react-native-fs@2.39.0.patch
  '@openid4vc/oauth2@0.5.6': patches/@openid4vc__oauth2@0.5.6.patch
  # Patches required for DC API
  react-native-keychain: patches/react-native-keychain.patch
  react-native@0.88.0: patches/react-native@0.88.0.patch

allowBuilds:
  '@hyperledger/anoncreds-react-native': true
  '@openwallet-foundation/askar-nodejs': true
  '@openwallet-foundation/askar-react-native': true
  '@shopify/react-native-skia': true
  cbor-extract: false
  esbuild: false
  koffi: true
  protobufjs: false
  react-native-nitro-modules: true
  secp256k1: false

catalog:
  expo: ^58.0.17
  react-native: 0.88.0
  react: 19.3.0
  "@types/react": ~19.3.0
  typescript: ~6.0.3
  "@tanstack/react-query": ^5.101.1
  tsdown: ^0.22.3

  # Babel
  "@babel/core": ^7.29.0
  babel-plugin-syntax-hermes-parser: ^0.36.1
  babel-plugin-module-resolver: ^5.0.3

  # Credo / Agent / SSI
  credo-ts-didweb-anoncreds: 0.0.2-alpha.6
  rxjs: ^7.8.2
  query-string: ^9.4.0
  "@animo-id/eudi-wallet-functionality": 0.1.0
  "@animo-id/expo-secure-environment": 0.1.5
  "@animo-id/expo-digital-credentials-api": 0.5.1
  expo-mdoc-data-transfer: 0.2.0
  "@owf/mdoc": ^0.8.0
  "@owf/cose": ^0.4.0
  "@owf/eudi-sca": ^0.4.0
  "@openid4vc/oauth2": ^0.5.6
  "@openid4vc/openid4vp": ^0.5.6
  "@openid4vc/openid4vci": ^0.5.6
  "@openid4vc/utils": ^0.5.6
  "@credo-ts/anoncreds": 0.7.1-alpha-20260917134851
  "@credo-ts/askar": 0.7.1-alpha-20260917134851
  "@credo-ts/cheqd": 0.7.1-alpha-20260917134851
  "@credo-ts/core": 0.7.1-alpha-20260917134851
  "@credo-ts/openid4vc": 0.7.1-alpha-20260917134851
  "@credo-ts/question-answer": 0.7.1-alpha-20260917134851
  "@credo-ts/react-native": 0.7.1-alpha-20260917134851
  "@credo-ts/didcomm": 0.7.1-alpha-20260917134851
  "@credo-ts/webvh": 0.7.1-alpha-20260917134851
  "@hyperledger/anoncreds-react-native": 0.4.1-alpha-20260609124337
  "@hyperledger/anoncreds-shared": 0.4.1-alpha-20260609124337
  "@openwallet-foundation/askar-react-native": 0.6.1-alpha-20260609123727
  "@openwallet-foundation/askar-shared": 0.6.1-alpha-20260609123727
  buffer: 6.0.3
  "@astronautlabs/jsonpath": ^1.1.2

  # React Native
  react-native-heroicons: ^4.0.0
  "@react-native-masked-view/masked-view": 0.3.2
  "@react-native-picker/picker": 2.11.4
  react-native-keychain: ^10.0.0
  react-native-get-random-values: ^2.0.0
  react-native-gesture-handler: ~3.3.0
  react-native-reanimated: 4.7.1
  react-native-worklets: 0.13.0
  react-native-safe-area-context: ~5.10.1
  react-native-screens: 4.30.0
  react-native-svg: 15.16.0
  # React Native FS is not maintained, and doesn't support new Arch
  # this seems to be the best maintained fork. We might want to switch
  # to Expo FileSystem, but Credo depends on react-native-fs
  "react-native-fs": "npm:@dr.pogodin/react-native-fs@^2.36.1"
  react-native-mmkv: ^4.3.2
  react-native-qrcode-svg: ^6.3.21
  react-native-reanimated-carousel: ^5.2.0
  react-native-nitro-modules: ^0.35.10
  # OpenSSL through Nitro. Only used for RSA signature verification: askar and the secure
  # environment are both EC-only, so without it an issuer chaining up to an RSA CA cannot be
  # verified at all. react-native-quick-base64 is its peer dependency.
  react-native-quick-crypto: ^1.1.7
  react-native-quick-base64: ^3.0.0
  burnt: ^0.13.0
  "@react-native-community/blur": ^4.4.1
  react-native-edge-to-edge: ^1.8.1
  '@shopify/react-native-skia': 2.14.0

  # Lingui (i18n)
  "@lingui/babel-plugin-lingui-macro": ^6.4.0
  "@lingui/cli": ^6.4.0
  "@lingui/format-json": ^6.4.0

  # Expo (SDK 58 uses unified 58.x versioning across expo-* packages)
  # Versions aligned with Expo SDK 58 bundledNativeModules.
  expo-crypto: ~58.0.7
  expo-camera: ~58.0.12
  expo-network: ~58.0.4
  expo-application: ~58.1.2
  expo-asset: ~58.0.18
  expo-blur: ~58.0.5
  expo-constants: ~58.0.13
  expo-dev-client: ~58.0.14
  expo-device: ~58.0.5
  expo-file-system: ~58.0.10
  expo-font: ~58.0.9
  expo-haptics: ~58.0.7
  expo-image: ~58.0.16
  expo-image-manipulator: ~58.0.15
  expo-linear-gradient: ~58.0.3
  expo-linking: ~58.0.14
  expo-router: ~58.0.25
  expo-secure-store: ~58.0.2
  expo-splash-screen: ~58.0.11
  expo-system-ui: ~58.0.6
  expo-updates: ~58.0.18
  expo-web-browser: ~58.0.6
  expo-build-properties: ~58.0.11
  expo-build-disk-cache: ^0.8.0
  expo-localization: ~58.0.5
  "@expo-google-fonts/open-sans": ^0.4.2
  "@expo-google-fonts/raleway": ^0.4.2

  # Tamagui
  "@tamagui/animations-react-native": 2.3.3
  "@tamagui/font-inter": 2.3.3
  "@tamagui/shorthands": 2.3.3
  "@tamagui/themes": 2.3.3
  "@tamagui/toast": 2.3.3
  "@tamagui/react-native-media-driver": 2.3.3
  "@tamagui/colors": 2.3.3
  "@tamagui/lucide-icons-2": 2.3.3
  "@tamagui/babel-plugin": 2.3.3
  tamagui: 2.3.3

minimumReleaseAgeExclude:
