appId: id.paradym.wallet.preview
---
# Deeplink is passed via the env variable in the runFlow call from the parent flow (either issue-none-didcomm.yaml or issue-none-openid4vc.yaml).
- openLink:
    link: ${deeplink}

# Android shows an app chooser when other installed wallets handle the link too
- runFlow:
    when:
      visible: Open with
      platform: Android
    commands:
      - tapOn: Paradym Wallet \(Preview\)
      # Not shown on every device: some open the app as soon as it is picked
      - tapOn:
          text: Just once
          optional: true

- runFlow:
    when:
      visible: .*Open in.*
      platform: ios
    commands:
      - tapOn: Open

- repeat:
    times: 6
    commands:
      - tapOn: "Pin number 1"

- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: "Yes, continue"
    timeout: 100000
- tapOn: "Yes, continue"

- waitForAnimationToEnd:
    timeout: 5000

- runFlow:
    when:
      true: ${!output.deeplink.startsWith('didcomm')}
    commands:
      - assertVisible: "Card offered"
      - tapOn: "Continue"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible: "Do you want to store this card?"
- assertVisible: "Decline"
- tapOn: "Accept"

- waitForAnimationToEnd:
    timeout: 30000

- extendedWaitUntil:
    visible: "Success!|.*for Identity Verification\\?"
    timeout: 120000
- runFlow: ../common/allow-identity-verification.yaml
- assertVisible: "Success!"

- waitForAnimationToEnd:
    timeout: 30000
- extendedWaitUntil:
    visible: "Card successfully added to your wallet!"
    timeout: 10000

# On Android the button is "Go to wallet" (without space), while on iOS a trailing space is required.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Go to wallet"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Go to wallet,  "

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible: "Hello!"
- assertVisible: "Receive or share from your wallet "
