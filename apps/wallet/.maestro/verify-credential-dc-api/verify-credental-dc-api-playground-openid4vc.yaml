appId: id.paradym.wallet.preview
tags:
  - verification
  - authorization-none
  - openid4vc
  - mdoc
  - x5c
  - digital-credentials-api
  - playground
---
- runFlow: ../onboarding.yaml

# Issue credential
- runScript:
    file: ../scripts/request.js
    env:
      ACTION: '{"action":"createOffer", "authorization":"none", "requestType": "mdl-mdoc", "flow": "openid4vc"}'
      ISSUER_BACKEND: ${MAESTRO_ISSUER_BACKEND}

- runFlow:
    file: ../issue-none/issue-none.yaml
    env:
      deeplink: ${output.deeplink}

# Start the request from the playground in the browser. iOS (26+) only supports the
# org-iso-mdoc protocol, Android uses OpenID4VP.
- runFlow:
    when:
      platform: iOS
    file: dc-api-request-ios.yaml
- runFlow:
    when:
      platform: Android
    file: dc-api-request-android.yaml

# Unlock the wallet and share from the wallet's request UI
- extendedWaitUntil:
    visible: Unlock your wallet
    timeout: 30000
# On iOS 27 Maestro loses the request UI after the first tap. The pin pad then covers the
# screen, so the key is tapped by position. One tap per iteration: position first, then label.
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            notVisible: "Pin number 1"
            platform: iOS
          commands:
            - tapOn:
                point: 14%,69%
      - runFlow:
          when:
            visible: "Pin number 1"
          commands:
            - tapOn: "Pin number 1"
- extendedWaitUntil:
    visible: Do you trust Animo Playground\?
    timeout: 15000
    optional: true
# Same as the pin pad: on iOS 27 Share is tapped by position, position first, then label
- runFlow:
    when:
      notVisible: Do you trust Animo Playground\?
      platform: iOS
    commands:
      - tapOn:
          point: 74%,93%
- runFlow:
    when:
      visible: Do you trust Animo Playground\?
    commands:
      - assertVisible: Given name
      - assertVisible: Family name
      - tapOn: Share

# It's a bit slow when running with Maestro
- extendedWaitUntil:
    visible: "Verification Successful"
    timeout: 100000
