appId: id.paradym.wallet.preview
---
- openLink:
    link: ${deeplink}

- runFlow:
    when:
      visible: .*Open in.*
      platform: ios
    commands:
      - tapOn: Open

- repeat:
    times: 6
    commands:
      - tapOn: "Pin number 1"

- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: "Yes, continue"
    timeout: 100000

- tapOn: "Yes, continue"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible: Verify your account
- tapOn: "Authenticate"

- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: .*to Sign In.*
      - tapOn: Continue

- waitForAnimationToEnd:
    timeout: 5000

# Depending on the device, Chrome shows its first run screen before the sign-in page
- extendedWaitUntil:
    visible: Enter any login|the client is asking you to confirm previously given authorization|Make Chrome your own
    timeout: 15000
- runFlow:
    when:
      visible: Make Chrome your own
    commands:
      - tapOn: Use without an account

# Ensure text for conditional flow is visible
- extendedWaitUntil:
    visible: Enter any login|the client is asking you to confirm previously given authorization
    timeout: 15000

# If already signed-in previously
- runFlow:
    when:
      visible: the client is asking you to confirm previously given authorization
    commands:
      - tapOn: Continue

# Has not signed in previously
- runFlow:
    when:
      platform: iOS
      visible: Enter any login

    commands:
      - tapOn: Enter any login
      - inputText: "username"
      - tapOn: and password
      - inputText: "password"
      - tapOn:
          text: Sign-in
          index: 1
      - runFlow:
          when:
            visible: Save Password?
          commands:
            - tapOn: Never for This Website
      - tapOn: Continue

- runFlow:
    when:
      platform: Android
      visible: Sign-in
    commands:
      - waitForAnimationToEnd:
          timeout: 15000

      - extendedWaitUntil:
          visible: "Sign-in"
          timeout: 10000

      - runFlow:
          when:
            visible: Try out your stylus
          commands:
            - tapOn: Cancel

      - tapOn: Enter any login
      - runFlow:
          when:
            visible: Try out your stylus
          commands:
            - tapOn: Cancel
      - inputText: test
      - runFlow:
          when:
            visible: Try out your stylus
          commands:
            - tapOn: Cancel
      - tapOn: and password
      - runFlow:
          when:
            visible: Try out your stylus
          commands:
            - tapOn: Cancel
      - inputText: test
      - runFlow:
          when:
            visible: Try out your stylus
          commands:
            - tapOn: Cancel
      - tapOn:
          text: Sign-in
          index: 1

      - runFlow:
          when:
            visible: Try out your stylus
          commands:
            - tapOn: Cancel

      - tapOn: Continue

# The wallet opens directly, or the browser shows a page to go back to it
- extendedWaitUntil:
    visible: "Go back to Paradym Wallet|Do you want to store this card\\?"
    timeout: 15000
- runFlow:
    when:
      visible: "Go back to Paradym Wallet"
    commands:
      # The page can still be loading when the heading shows up
      - extendedWaitUntil:
          visible:
            text: Go back to Paradym Wallet
            below: It seems you were not automatically redirected.*
          timeout: 15000
      - tapOn:
          text: Go back to Paradym Wallet
          below: It seems you were not automatically redirected.*

- extendedWaitUntil:
    visible: "Do you want to store this card\\?"
    timeout: 15000

- tapOn: Accept
- assertVisible: Success!

# On Android the button is "Go to wallet" (without space), while on iOS a trailing space is required.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Go to wallet"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Go to wallet,  "
- assertVisible: Hello!
