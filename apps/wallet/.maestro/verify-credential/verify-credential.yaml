appId: id.paradym.wallet.preview
---
- openLink:
    link: ${deeplink}

# Android shows an app chooser when other installed wallets handle the link too
- runFlow:
    when:
      visible: Open with
      platform: Android
    commands:
      - tapOn: Paradym Wallet \(Preview\)
      # Not shown on every device: some open the app as soon as it is picked
      - tapOn:
          text: Just once
          optional: true

- runFlow:
    when:
      visible: .*Open in.*
      platform: ios
    commands:
      - tapOn: Open

- repeat:
    times: 6
    commands:
      - tapOn: "Pin number 1"

- extendedWaitUntil:
    visible: "Yes, continue"
    timeout: 100000
- tapOn: "Yes, continue"

- assertVisible: Review the request
- tapOn: Share

# OpenID4VC asks for the PIN again to confirm sharing, DIDComm doesn't
- extendedWaitUntil:
    visible: "Pin number 1|Success!"
    timeout: 100000
- runFlow:
    when:
      visible: "Pin number 1"
    commands:
      - repeat:
          times: 6
          commands:
            - tapOn: "Pin number 1"
- assertVisible: Success!

# On Android the button is "Go to wallet" (without space), while on iOS a trailing space is required.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Go to wallet"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Go to wallet,  "
