name: End-to-End Maestro Test

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: 'Platform to test on'
        required: true
        options:
          - 'android'
          - 'ios'
          - 'all'
        default: 'all'
      issuer_backend:
        type: choice
        description: 'Backend issuer for the tests'
        required: true
        options:
          - 'playground'
          - 'paradym'
          - 'both'
        default: 'playground'
      enable_recording:
        type: boolean
        required: false
        description: 'Enable screen recording'
        default: false

jobs:
  e2e:
    name: E2E (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event.inputs.platform == 'all' && '["android", "ios"]' || format('["{0}"]', github.event.inputs.platform)) }}
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v7

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - uses: pnpm/action-setup@v6

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_PUBLISHER_ACCESS_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🚀 Build
        run: pnpm build

      # Waits for the EAS workflow so this run fails when the build or a Maestro flow fails
      - name: 🧪 EAS Workflow
        working-directory: apps/wallet
        run: eas workflow:run .eas/workflows/e2e-test-${{ matrix.platform }}.yaml --non-interactive --wait -F issuer_backend=${{ github.event.inputs.issuer_backend }} -F paradym_api_key=${{ secrets.PARADYM_API_KEY }} -F enable_recording=${{ github.event.inputs.enable_recording }}
