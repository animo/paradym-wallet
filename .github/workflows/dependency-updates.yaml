name: Dependency Updates

on:
  schedule:
    # Mondays at 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      test_branch:
        type: string
        required: false
        description: 'Only test this deps/* branch in the app, without updating dependencies'

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  update:
    if: ${{ !inputs.test_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    outputs:
      branches: ${{ steps.pushed.outputs.branches }}
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - uses: pnpm/action-setup@v6

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📌 Record update branches
        run: git ls-remote origin 'refs/heads/deps/*' | sort > "$RUNNER_TEMP/deps-before.txt"

      # Without `github_token` the action pushes and opens PRs as the Claude GitHub App, so CI runs on the PRs
      - name: 🤖 Update dependencies
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /update-dependencies
          # The expo plugin brings the expo-upgrade skill for SDK upgrades
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: expo@claude-plugins-official
          display_report: true
          # Pushes can only reach deps/* branches: main requires a reviewed PR
          claude_args: |
            --model claude-opus-5-5
            --max-turns 500
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,Skill,Bash"

      - name: 🔎 Find pushed branches
        id: pushed
        run: |
          git ls-remote origin 'refs/heads/deps/*' | sort > "$RUNNER_TEMP/deps-after.txt"
          branches=$(comm -13 "$RUNNER_TEMP/deps-before.txt" "$RUNNER_TEMP/deps-after.txt" | awk '{ sub("refs/heads/", "", $2); print $2 }' | jq -R . | jq -sc .)
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  test:
    needs: update
    if: ${{ always() && (inputs.test_branch || (needs.update.result == 'success' && needs.update.outputs.branches != '[]')) }}
    name: Test ${{ matrix.branch }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(inputs.test_branch && format('["{0}"]', inputs.test_branch) || needs.update.outputs.branches) }}
        platform: [ios, android]
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    env:
      # CocoaPods fails with "Unicode Normalization not appropriate for ASCII-8BIT" without it
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DO_NOT_TRACK: '1'
      ARGENT_EMULATOR_NO_WINDOW: '1'
      RESULTS_DIR: /tmp/test-results
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: 🧹 Free disk space
        if: ${{ matrix.platform == 'android' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@angular

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - uses: pnpm/action-setup@v6

      - name: 📦 Install dependencies
        run: |
          pnpm install --frozen-lockfile
          mkdir -p "$RESULTS_DIR"

      # The default Xcode, which has simulator runtimes installed for it
      - name: 🍎 Boot iOS simulator
        id: ios
        if: ${{ matrix.platform == 'ios' }}
        run: |
          xcodebuild -version
          # The newest iPhone Pro on the newest iOS runtime
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | test("iOS-[0-9]")) | { v: (.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)") | [(.major | tonumber), (.minor | tonumber)]), d: .value[] } | select(.d.name | test("^iPhone [0-9]+ Pro$"))] | sort_by(.v) | last | .d.udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "device=$udid" >> "$GITHUB_OUTPUT"

      - name: ☕ Setup Java
        if: ${{ matrix.platform == 'android' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Boot Android emulator
        id: android
        if: ${{ matrix.platform == 'android' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          image='system-images;android-36;google_apis;x86_64'
          yes | sdkmanager emulator platform-tools "$image" > /dev/null
          # The newest Pixel profile this avdmanager knows
          profile=$(avdmanager list device -c | grep -E '^pixel_[0-9]+$' | sort -t_ -k2 -n | tail -1)
          echo no | avdmanager create avd --name wallet --package "$image" --device "$profile"
          nohup emulator -avd wallet -no-window -no-audio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -memory 4096 > "$RESULTS_DIR/emulator.log" 2>&1 &
          adb wait-for-device
          for _ in $(seq 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]
          echo "device=$(adb devices | awk 'NR==2 { print $1 }')" >> "$GITHUB_OUTPUT"

      # The MCP server connects to this tool server. Starting it here shows startup problems in this step
      - name: 📱 Start Argent
        run: |
          npm install --global @swmansion/argent@0.30.1
          mkdir -p ~/.claude/skills
          cp -R "$(npm root --global)/@swmansion/argent/skills/." ~/.claude/skills/
          echo '{"mcpServers":{"argent":{"command":"argent","args":["mcp"]}}}' > /tmp/argent-mcp.json
          argent server start --detach
          for _ in $(seq 60); do
            argent server status | grep -q 'health: *ok' && break
            sleep 2
          done
          argent server status | grep -q 'health: *ok' || { argent server logs; exit 1; }

      - name: 🤖 Test in the app
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /test-dependency-update platform=${{ matrix.platform }} device=${{ steps.ios.outputs.device || steps.android.outputs.device }} branch=${{ matrix.branch }} results=/tmp/test-results run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: expo@claude-plugins-official
          display_report: true
          claude_args: |
            --model claude-opus-5-5
            --max-turns 500
            --mcp-config /tmp/argent-mcp.json
            --add-dir /tmp/test-results
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,Skill,Bash,mcp__argent"

      - name: 🪵 Save Argent log
        if: ${{ always() }}
        run: argent server logs > "$RESULTS_DIR/argent-server.log" 2>&1 || true

      - name: 📸 Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}-${{ strategy.job-index }}
          path: /tmp/test-results
          if-no-files-found: ignore
