name: Continuous Deployment

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: 'Channel to deploy to. The preview channel creates an internal preview build and is available for download on Expo.dev. The production channel creates a production build and uploads this build to be released in the stores. It does not make a release in the stores yet.'
        required: true
        options:
          - 'preview'
          - 'preview-simulator'
          - 'production'
        default: 'preview'
      platform:
        type: choice
        description: 'Platform to deploy to'
        required: true
        options:
          - 'android'
          - 'ios'
          - 'all'
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v7

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - uses: pnpm/action-setup@v6

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_PUBLISHER_ACCESS_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🚀 Build
        run: pnpm build

      - name: 🚀 Build internal preview
        if: ${{ github.event.inputs.channel == 'preview' }}
        working-directory: apps/wallet
        run: eas build --non-interactive --platform ${{ github.event.inputs.platform }} --profile preview --no-wait

      - name: 🚀 Build internal preview for simulator
        if: ${{ github.event.inputs.channel == 'preview-simulator' }}
        working-directory: apps/wallet
        run: eas build --non-interactive --platform ${{ github.event.inputs.platform }} --profile preview-simulator --no-wait

      - name: 🚀 Build and Submission to TestFlight / Alpha Track
        if: ${{ github.event.inputs.channel == 'production' }}
        working-directory: apps/wallet
        run: eas build --non-interactive --platform ${{ github.event.inputs.platform }} --profile production --no-wait --auto-submit
