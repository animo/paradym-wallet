version: 2
updates:
  # npm dependencies are updated by the Dependency Updates workflow (.github/workflows/dependency-updates.yaml)

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: Europe/Amsterdam
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"